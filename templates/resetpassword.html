{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="card p-4 shadow">

        <h3 class="text-center mb-4">
            Create New Password
        </h3>

        <form method="POST">

            <input type="password"
                   name="password"
                   class="form-control mb-3"
                   placeholder="New Password"
                   required>

            <button class="btn btn-danger w-100">
                Update Password
            </button>

        </form>

    </div>
</div>

{% endblock %}
